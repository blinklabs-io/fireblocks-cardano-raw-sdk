name: Live native-token transfer

on:
  workflow_dispatch:
    inputs:
      network:
        description: Cardano network
        required: true
        default: preview
        type: choice
        options: [preview, preprod, mainnet]
      token_policy_id:
        description: Token policy ID (hex)
        required: true
      token_name:
        description: Asset name (hex, or UTF-8 when selected below)
        required: true
      token_name_utf8:
        description: Interpret token_name as UTF-8
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      transfer_token_amount:
        description: Amount in token base units
        required: true
      source_vault:
        description: Source vault account ID
        required: true
      dest_vault:
        description: Destination vault account ID
        required: true
      address_index:
        description: Source address index
        required: true
        default: "0"
      recipient_index:
        description: Recipient address index
        required: true
        default: "0"
      token_transfer_mode:
        description: full, estimate only, or transfer without estimate
        required: true
        default: estimate
        type: choice
        options: [estimate, full, transfer]
      confirm_mainnet:
        description: Type I_UNDERSTAND_THIS_USES_REAL_FUNDS when selecting mainnet
        required: false

permissions:
  contents: read

concurrency:
  group: live-token-${{ inputs.network }}-${{ inputs.source_vault }}
  cancel-in-progress: false

jobs:
  token-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cardano-${{ inputs.network }}
    steps:
      - name: Reject unconfirmed mainnet execution
        if: inputs.network == 'mainnet' && inputs.confirm_mainnet != 'I_UNDERSTAND_THIS_USES_REAL_FUNDS'
        run: |
          echo "Mainnet requires the exact confirmation phrase." >&2
          exit 1
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source
        run: npm run quality
      - name: Run native-token operation
        env:
          FIREBLOCKS_API_USER_KEY: ${{ secrets.FIREBLOCKS_API_KEY }}
          FIREBLOCKS_API_USER_SECRET_KEY: ${{ secrets.FIREBLOCKS_API_SECRET }}
          IAGON_API_KEY: ${{ secrets.IAGON_API_KEY }}
          CARDANO_NETWORK: ${{ inputs.network }}
          TOKEN_POLICY_ID: ${{ inputs.token_policy_id }}
          TOKEN_NAME: ${{ inputs.token_name }}
          TOKEN_NAME_UTF8: ${{ inputs.token_name_utf8 }}
          TRANSFER_TOKEN_AMOUNT: ${{ inputs.transfer_token_amount }}
          SOURCE_VAULT: ${{ inputs.source_vault }}
          DEST_VAULT: ${{ inputs.dest_vault }}
          ADDRESS_INDEX: ${{ inputs.address_index }}
          RECIPIENT_INDEX: ${{ inputs.recipient_index }}
          TOKEN_TRANSFER_MODE: ${{ inputs.token_transfer_mode }}
          FIREBLOCKS_BASE_PATH: ${{ secrets.FIREBLOCKS_BASE_PATH }}
        run: npx tsx scripts/test-token-transfer.ts
