name: Live staking operation

on:
  workflow_dispatch:
    inputs:
      network:
        description: Cardano network
        required: true
        default: preview
        type: choice
        options: [preview, preprod, mainnet]
      vault_account_id:
        description: Vault account ID
        required: true
      staking_action:
        description: Staking action
        required: true
        default: info
        type: choice
        options: [info, register, delegate, withdraw]
      pool_id:
        description: Pool ID (required for delegate)
        required: false
      confirm_mainnet:
        description: Type I_UNDERSTAND_THIS_USES_REAL_FUNDS when selecting mainnet
        required: false

permissions:
  contents: read

concurrency:
  group: live-staking-${{ inputs.network }}-${{ inputs.vault_account_id }}
  cancel-in-progress: false

jobs:
  staking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cardano-${{ inputs.network }}
    steps:
      - name: Reject unconfirmed mainnet execution
        if: inputs.network == 'mainnet' && inputs.confirm_mainnet != 'I_UNDERSTAND_THIS_USES_REAL_FUNDS'
        run: |
          echo "Mainnet requires the exact confirmation phrase." >&2
          exit 1
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source
        run: npm run quality
      - name: Run staking operation
        env:
          FIREBLOCKS_API_USER_KEY: ${{ secrets.FIREBLOCKS_API_KEY }}
          FIREBLOCKS_API_USER_SECRET_KEY: ${{ secrets.FIREBLOCKS_API_SECRET }}
          IAGON_API_KEY: ${{ secrets.IAGON_API_KEY }}
          CARDANO_NETWORK: ${{ inputs.network }}
          VAULT_ACCOUNT_ID: ${{ inputs.vault_account_id }}
          STAKING_ACTION: ${{ inputs.staking_action }}
          POOL_ID: ${{ inputs.pool_id }}
          FIREBLOCKS_BASE_PATH: ${{ secrets.FIREBLOCKS_BASE_PATH }}
        run: npx tsx scripts/test-staking.ts
