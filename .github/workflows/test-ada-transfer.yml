name: Live ADA transfer

on:
  workflow_dispatch:
    inputs:
      network:
        description: Cardano network
        required: true
        default: preview
        type: choice
        options: [preview, preprod, mainnet]
      amount_ada:
        description: Amount in ADA
        required: true
        default: "2"
      source_vault:
        description: Source vault account ID
        required: true
      dest_vault:
        description: Destination vault account ID
        required: true
      confirm_mainnet:
        description: Type I_UNDERSTAND_THIS_USES_REAL_FUNDS when selecting mainnet
        required: false

permissions:
  contents: read

concurrency:
  group: live-ada-${{ inputs.network }}-${{ inputs.source_vault }}
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cardano-${{ inputs.network }}
    steps:
      - name: Reject unconfirmed mainnet execution
        if: inputs.network == 'mainnet' && inputs.confirm_mainnet != 'I_UNDERSTAND_THIS_USES_REAL_FUNDS'
        run: |
          echo "Mainnet requires the exact confirmation phrase." >&2
          exit 1
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source
        run: npm run quality
      - name: Run live ADA transfer
        env:
          FIREBLOCKS_API_USER_KEY: ${{ secrets.FIREBLOCKS_API_KEY }}
          FIREBLOCKS_API_USER_SECRET_KEY: ${{ secrets.FIREBLOCKS_API_SECRET }}
          IAGON_API_KEY: ${{ secrets.IAGON_API_KEY }}
          CARDANO_NETWORK: ${{ inputs.network }}
          TRANSFER_AMOUNT_ADA: ${{ inputs.amount_ada }}
          SOURCE_VAULT: ${{ inputs.source_vault }}
          DEST_VAULT: ${{ inputs.dest_vault }}
          FIREBLOCKS_BASE_PATH: ${{ secrets.FIREBLOCKS_BASE_PATH }}
        run: npx tsx scripts/test-ada-transfer.ts
